name: Scrape TN811 Portal

on:
  schedule:
    # Twice daily: 6:00 AM and 6:00 PM Central Time
    # CDT (UTC-5): 11:00 UTC and 23:00 UTC
    # CST (UTC-6): 12:00 UTC and 00:00 UTC
    # Using CDT times as the year-round schedule
    - cron: "0 11 * * *"   # 6:00 AM CT
    - cron: "0 23 * * *"   # 6:00 PM CT
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (no writes)"
        required: false
        default: "false"
        type: boolean
      county:
        description: "Specific county to scrape (leave blank for all)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  scrape:
    name: Scrape & Update
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      PYTHONUNBUFFERED: "1"
      # SMTP secrets are only needed for remind.yml; not required here
      SMTP_HOST: ""
      SMTP_PORT: ""
      SMTP_USER: ""
      SMTP_PASS: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Materialize monitoring config
        env:
          MONITORING_YAML: ${{ secrets.MONITORING_YAML }}
        run: |
          if [ -z "${MONITORING_YAML}" ]; then
            echo "::error::Repository secret MONITORING_YAML is not set. Add the live config/monitoring.yaml contents as that secret (do not commit the file)."
            exit 1
          fi
          python -c 'import os, pathlib; pathlib.Path("config/monitoring.yaml").write_text(os.environ["MONITORING_YAML"], encoding="utf-8")'
          test -s config/monitoring.yaml
          echo "Wrote config/monitoring.yaml ($(wc -c < config/monitoring.yaml) bytes)."

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: |
          pip install -e "apps/jobs[dev]"

      - name: Install Playwright browsers
        run: playwright install chromium --with-deps

      - name: Ensure data directories exist
        run: |
          mkdir -p data/raw/html data/raw/pdf data/parsed data/exports

      - name: Initialize database (idempotent)
        run: |
          python -m tn811.cli init-db --config config/monitoring.yaml

      - name: Run scrape
        run: |
          DRY_FLAG=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            DRY_FLAG="--dry-run"
          fi
          COUNTY_FLAG=""
          if [ -n "${{ github.event.inputs.county }}" ]; then
            COUNTY_FLAG="--county '${{ github.event.inputs.county }}'"
          fi
          python -m tn811.cli scrape \
            --config config/monitoring.yaml \
            $DRY_FLAG \
            $COUNTY_FLAG

      - name: Build dashboard JSON
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          python -m tn811.cli build-json --config config/monitoring.yaml

      - name: Export CSV bundle
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          python -m tn811.cli export-csv \
            --config config/monitoring.yaml \
            --sub-slices \
            --no-desktop

      - name: Export KMZ
        if: ${{ github.event.inputs.dry_run != 'true' }}
        continue-on-error: true
        run: |
          python -m tn811.cli export-kmz \
            --config config/monitoring.yaml \
            --no-desktop

      - name: Upload export artifacts
        if: ${{ always() && github.event.inputs.dry_run != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: tn811-exports-${{ github.run_id }}
          path: |
            data/exports/
            data/tn811.db
          retention-days: 30
          if-no-files-found: warn

      - name: Upload raw artifacts (for debugging)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scrape-raw-${{ github.run_id }}
          path: |
            data/raw/html/
            data/parsed/
            data/tn811-monitor.log
          retention-days: 7
          if-no-files-found: ignore
