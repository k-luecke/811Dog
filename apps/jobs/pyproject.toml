[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tn811"
version = "0.1.0"
description = "TN811 ticket monitor for relevant excavation work"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "sqlalchemy>=2.0",
    "playwright>=1.44",
    "pdfplumber>=0.11",
    "PyMuPDF>=1.24",
    "click>=8.1",
    "pyyaml>=6.0",
    "structlog>=24.1",
    "aiofiles>=23.2",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "html5lib>=1.1",
    "python-dotenv>=1.0",
    "Jinja2>=3.1",
    "tenacity>=8.3",
    "pytz>=2024.1",
    "simplekml>=1.3",
    "shapely>=2.0",
    "pyproj>=3.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-PyYAML",
    "types-pytz",
    "Faker>=25.0",
]
ocr = [
    "pytesseract>=0.3",
    "Pillow>=10.3",
]

[project.scripts]
tn811 = "tn811.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "PTH", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"
