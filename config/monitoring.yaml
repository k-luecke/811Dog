# config/monitoring.yaml
# TN811 Monitor — reference configuration
# Copy this to monitoring.yaml and customize.

# ── Database ─────────────────────────────────────────────────────────────────
db:
  url: "sqlite:///data/tn811.db"
  # For Postgres: "postgresql+psycopg2://user:pass@host:5432/tn811"

# ── Portal ───────────────────────────────────────────────────────────────────
portal:
  base_url: "https://gcv3.tn811.com"
  # Appended as-is after the base URL
  search_path: "/geocall/portal"
  # Query string sent on every search request
  search_params: "directaccess=find"
  # Rolling lookback window for normal runs (must be <= 30; portal hard limit)
  date_window_days: 30
  # Playwright headless mode
  headless: true
  # Request timeout ms
  timeout_ms: 30000
  # Retry config
  max_retries: 3
  retry_backoff_base_s: 2.0

# ── Counties to monitor ───────────────────────────────────────────────────────
counties:
  - name: "Davidson County"
    state: "TN"
    # Exact value used in the portal's county dropdown
    portal_search_value: "DAVIDSON"
    enabled: true
  - name: "Rutherford County"
    state: "TN"
    portal_search_value: "RUTHERFORD"
    enabled: true
  # To add more counties later:
  # - name: "Williamson County"
  #   state: "TN"
  #   portal_search_value: "Williamson"
  #   enabled: false

# ── Data paths ────────────────────────────────────────────────────────────────
paths:
  raw_html_dir: "data/raw/html"
  raw_pdf_dir: "data/raw/pdf"
  parsed_dir: "data/parsed"
  exports_dir: "data/exports"
  reminder_preview_dir: "data/parsed/reminder_previews"

# ── CSV exports ──────────────────────────────────────────────────────────────
# Controls where `tn811 export-csv` places its supervisor CSV bundle in addition
# to the in-repo `paths.exports_dir`. The mirror is a convenience so the files
# land on the Windows desktop without manual WSL copying.
exports:
  # Windows path to mirror the export bundle into. From WSL this is under
  # /mnt/c/Users/<windows-user>/. Quote the whole string so spaces in the user
  # name don't break parsing.
  desktop_mirror_path: "/mnt/c/Users/Kyle W. Luecke/Desktop/811dog"
  # If false, skip the desktop copy entirely. Use `--no-desktop` on the CLI for
  # a one-off skip without editing the config.
  desktop_mirror_enabled: true

# ── PDF parsing ───────────────────────────────────────────────────────────────
pdf:
  # Primary parser: pdfplumber | pymupdf
  primary_parser: "pdfplumber"
  # Fall back to PyMuPDF if pdfplumber fails
  fallback_to_pymupdf: true
  # OCR: disabled by default; enable only if PDFs are scanned images
  ocr_enabled: false
  # Path to tesseract binary (only used if ocr_enabled: true)
  tesseract_path: "/usr/bin/tesseract"

# ── Relevance engine ──────────────────────────────────────────────────────────
relevance:
  # Tickets at or above this score are flagged is_gfiber_related
  score_threshold: 0.45

  # Weighted positive match rules
  # field: which ticket field(s) to search (comma-sep or "any")
  # match_type: contains | exact | regex
  # weight: contribution to score (scores are clamped 0.0–1.0)
  positive_rules:
    # ── Primary signals (done_for field is the strongest indicator) ────────────
    - id: done_for_google_fiber
      field: "done_for"
      match_type: "contains"
      pattern: "google fiber"
      weight: 1.0
      case_sensitive: false

    - id: done_for_google
      field: "done_for"
      match_type: "contains"
      pattern: "google"
      weight: 0.90
      case_sensitive: false

    # Ervin Cable Construction is a fiber-build prime that subs excavation
    # out to MAC Underground, Civcom, and others. In Davidson/Rutherford
    # their pipeline is dominated by Google Fiber work, and operationally we
    # want eyes on all of it — including any AT&T/Brightspeed share that may
    # show up later. Field is "done_for" so the rule does NOT match the
    # namesake "JEFF ERVIN" (a person, unrelated) or Ervin-as-excavator rows
    # whose done_for is a different prime.
    - id: done_for_ervin_cable
      field: "done_for"
      match_type: "contains"
      pattern: "ervin cable"
      weight: 1.0
      case_sensitive: false

    # GFI utility response code (utility_codes field populated from detail page)
    - id: utility_code_gfi
      field: "utility_codes"
      match_type: "contains"
      pattern: "GFI"
      weight: 1.0
      case_sensitive: false

    # ── Subcontractor keyword matches (handled separately in code, listed here
    #    for visibility — the hard-signal logic in matcher.py applies these) ──
    # blue ocean, florida armstrong, amzung, dto, civcom, cattail, ama

    # ── Existing high-confidence signals ──────────────────────────────────────
    - id: google_fiber_exact
      field: "any"
      match_type: "contains"
      pattern: "google fiber"
      weight: 1.0
      case_sensitive: false

    - id: gfiber_exact
      field: "any"
      match_type: "contains"
      pattern: "gfiber"
      weight: 1.0
      case_sensitive: false

    - id: ftth
      field: "any"
      match_type: "contains"
      pattern: "ftth"
      weight: 0.85
      case_sensitive: false

    - id: fiber_optic_install
      field: "any"
      match_type: "regex"
      pattern: "fiber[- ]optic[s]?\\s+(install|construction|deployment|build)"
      weight: 0.80
      case_sensitive: false

    - id: fiber_install
      field: "any"
      match_type: "regex"
      pattern: "fiber\\s+install"
      weight: 0.75
      case_sensitive: false

    - id: underground_fiber
      field: "any"
      match_type: "regex"
      pattern: "underground\\s+fiber"
      weight: 0.70
      case_sensitive: false

    - id: boring_fiber
      field: "any"
      match_type: "regex"
      pattern: "boring\\s+for\\s+fiber"
      weight: 0.70
      case_sensitive: false

    - id: drop_bury
      field: "any"
      match_type: "contains"
      pattern: "drop bury"
      weight: 0.65
      case_sensitive: false

    - id: telecom_fiber
      field: "any"
      match_type: "regex"
      pattern: "telecom(munications?)?\\s+fiber"
      weight: 0.65
      case_sensitive: false

    - id: telecom_construction
      field: "work_type"
      match_type: "contains"
      pattern: "telecom"
      weight: 0.40
      case_sensitive: false

    - id: fiber_generic
      field: "any"
      match_type: "contains"
      pattern: "fiber"
      weight: 0.30
      case_sensitive: false

  # Negative rules reduce score when matched
  negative_rules:
    - id: water_sewer_only
      field: "work_type"
      match_type: "regex"
      pattern: "^(water|sewer|storm\\s*drain|gas|electric|power)$"
      weight: -0.50
      case_sensitive: false

    - id: electric_utility_no_fiber
      field: "any"
      match_type: "contains"
      pattern: "electric utility"
      weight: -0.20
      case_sensitive: false

  # Manual overrides by ticket number take precedence over scoring
  overrides:
    include: []
    # - "TN20240101-123456"
    exclude: []
    # - "TN20240101-999999"

# ── Grouping / work-group inference ─────────────────────────────────────────
grouping:
  # Minimum token overlap ratio to cluster two tickets into same work group
  cluster_similarity_threshold: 0.60
  # Fields used for grouping similarity
  group_fields:
    - "excavator_name"
    - "work_type"
    - "location_text"

# ── Reminders ─────────────────────────────────────────────────────────────────
reminders:
  # Days before expiration to send reminder
  lead_days: 4
  # Timezone for expiration comparison
  timezone: "America/Chicago"
  # Email recipients (can be overridden by REMINDER_TO env var)
  recipients:
    - "team@example.com"
  # SMTP settings (can be sourced from env: SMTP_HOST, SMTP_PORT, etc.)
  smtp:
    host: "${SMTP_HOST}"
    port: 587
    user: "${SMTP_USER}"
    password: "${SMTP_PASS}"
    use_tls: true
    from_address: "tn811-monitor@example.com"
    from_name: "TN811 Monitor"

# ── Dashboard JSON ───────────────────────────────────────────────────────────
dashboard:
  # How many tickets to include in recent/expiring lists
  recent_limit: 100
  expiring_limit: 100
  changes_limit: 50
  failures_limit: 50
  # Days ahead to include in "expiring soon"
  expiring_window_days: 14

# ── Logging ───────────────────────────────────────────────────────────────────
logging:
  level: "INFO"
  # json | text
  format: "json"
  # Path for file log (optional, stdout always used)
  file: "data/tn811-monitor.log"
